name: Publish Docker images

# Publishes on version tags (v*):
#   - jonthekiller/rss-tracker:<version> + :latest (multi-arch amd64/arm64)
#   - jonthekiller/rss-tracker-addon-{amd64,aarch64}:<version> (Home Assistant add-on)
# Requires repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.
# The addon/config.json version must match the tag (checked below).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: jonthekiller/rss-tracker

jobs:
  main:
    name: Main image (multi-arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  addon:
    name: Home Assistant add-on (${{ matrix.ha_arch }})
    needs: main
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            ha_arch: amd64
          - platform: linux/arm64
            ha_arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check addon/config.json version matches the tag
        run: |
          addon_version=$(node -p "require('./addon/config.json').version")
          if [ "$addon_version" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::addon/config.json version ($addon_version) != tag version (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./addon
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}-addon-${{ matrix.ha_arch }}:${{ steps.version.outputs.version }}
          build-args: VERSION=${{ steps.version.outputs.version }}
